name: Daily S-HSSI Climate Data Refresh

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Update climate cache
        run: python update_climate_data.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "S-HSSI Bot"
          git config --global user.email "shssi-bot@github.com"
          git add climate_cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Daily climate data refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi